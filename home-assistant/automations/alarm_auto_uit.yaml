# =====================================================================
# Alarm automatisch uit bij thuiskomst — versie 2
# ---------------------------------------------------------------------
# Plakken over "Alarm: automatisch uit bij thuiskomst" (drie puntjes →
# Bewerken in YAML → Ctrl+A → plakken → Opslaan).
#
# EENMALIG INVULLEN: vervang JOUW_WIFI_NAAM (2x).
#
# WAT ER IS VERANDERD T.O.V. VERSIE 1
# Versie 1 eiste GPS-thuis ÉN wifi tegelijk. 's Nachts meldt een iPhone
# zijn locatie vaak te laat, dus stond de deur al open voordat HA wist
# dat je thuis was. Nu is ELK van beide signalen genoeg, mits het een
# echte thuiskomst is: de telefoon moet minstens 10 minuten ervoor weg
# zijn geweest (buiten de thuiszone, of niet op de thuiswifi).
#
# Waarom die 10 minuten: een telefoon die gewoon thuis op het
# nachtkastje ligt, valt soms een paar seconden van de wifi of zijn
# GPS-positie verspringt even. Zulke haperingen duren seconden, geen
# tien minuten — dus die schakelen het alarm niet uit. Een echte
# thuiskomst wel.
# =====================================================================

alias: "Alarm: automatisch uit bij thuiskomst"
description: >-
  Schakelt Alarmo uit zodra Mark of Sophie echt thuiskomt (GPS of wifi,
  na minstens 10 minuten afwezigheid).
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id:
      - device_tracker.iphone_van_mark
      - device_tracker.sophies_iphone
    to: home
    id: gps
  - trigger: state
    entity_id:
      - sensor.iphone_van_mark_ssid
      - sensor.sophies_iphone_ssid
    to: "JOUW_WIFI_NAAM"
    id: wifi

conditions:
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state:
      - armed_away
      - armed_home
      - armed_night
      - armed_vacation
      - arming
      - pending
      - triggered

  # Echte thuiskomst: de vorige toestand (weg / andere wifi) moet minstens
  # 10 minuten hebben geduurd, en mag geen opstart-status van HA zijn.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ['unknown', 'unavailable', 'home', 'JOUW_WIFI_NAAM']
         and (now() - trigger.from_state.last_changed).total_seconds() > 600 }}

actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.alarmo
    # Uitschakelcode in Alarmo ingesteld? Haal het commentaar weg:
    # data:
    #   code: "1234"

  - action: notify.mobile_app_iphone_van_mark
    data:
      title: "🔓 Alarm automatisch uit"
      message: >-
        {{ 'Mark' if 'iphone_van_mark' in trigger.entity_id else 'Sophie' }}
        is thuisgekomen ({{ 'GPS' if trigger.id == 'gps' else 'wifi' }}).
      data:
        push:
          interruption-level: passive
