# =====================================================================
# Losse automatisering — te plakken in de UI-editor
# ---------------------------------------------------------------------
# Instellingen → Automatiseringen & scènes → open
# "Buitenlampen: Automatisch uit (Schema)" → rechtsboven de drie puntjes
# → "Bewerken in YAML" → alles selecteren (Ctrl+A) → dit erover plakken
# → Opslaan.
#
# Dit vervangt je huidige automatisering volledig. Je hoeft dan NIET ook
# nog packages/buitenverlichting.yaml te installeren — kies er één,
# anders draaien ze dubbel.
#
# CONTROLEER de lampenlijst hieronder: afgeleid uit je entiteitenlijst,
# maar "Bar licht" en "LSC Moodlight" kunnen ook binnen hangen.
# =====================================================================

alias: "Buitenlampen: Automatisch uit (Schema)"
description: >-
  Schakelt de buitenverlichting uit en controleert of dat écht gelukt is
  (LSC/Tuya-commando's raken via de cloud regelmatig zoek). Speelt er
  muziek op de Nest buiten of in de keuken, dan blijft alles aan tot 03:00.
mode: single
max_exceeded: silent

triggers:
  - trigger: time
    at: "00:30:00"
    id: doordeweeks
  - trigger: time
    at: "01:30:00"
    id: weekend
  # Harde deadline + vangnet voor lampen die eerder offline waren
  - trigger: time
    at: "03:00:00"
    id: deadline
  - trigger: time
    at: "04:00:00"
    id: deadline
  - trigger: sun
    event: sunrise
    offset: "-00:30:00"
    id: deadline

conditions:
  - condition: or
    conditions:
      # Doordeweeks 00:30 — alleen als er géén muziek speelt
      - condition: and
        conditions:
          - condition: trigger
            id: doordeweeks
          - condition: time
            weekday: [mon, tue, wed, thu]
          - condition: not
            conditions:
              - condition: state
                entity_id:
                  - media_player.nest_audio            # Nest (buiten)
                  - media_player.chromecastaudio1336   # Keuken
                  - media_player.keuken_en_woonkamer   # groep Alle speakers
                state: playing
                match: any
      # Weekend 01:30 — idem
      - condition: and
        conditions:
          - condition: trigger
            id: weekend
          - condition: time
            weekday: [fri, sat, sun]
          - condition: not
            conditions:
              - condition: state
                entity_id:
                  - media_player.nest_audio
                  - media_player.chromecastaudio1336
                  - media_player.keuken_en_woonkamer
                state: playing
                match: any
      # 03:00 / 04:00 / voor zonsopkomst — altijd uit, muziek of niet
      - condition: trigger
        id: deadline

actions:
  - variables:
      buitenlampen:
        # --- tuin ---
        - light.tuin_verlichting
        - light.tuinlamp
        - light.tuinlamp_2
        - light.tuinspots
        - light.tuinlamp_overkap
        - light.lsc_smart_bulb_rgb_cct        # tuinlamp tuinhuis
        - light.lsc_smart_gls_a60             # tuinlamp garage
        - light.lsc_party_string_light_rgbic_cct
        - light.smart_plug_stopcontact_1      # lamp sterren
        - light.lsc_garden_spike_eu_stopcontact_1
        - light.lsc_garden_spike_eu_stopcontact_2
        - light.bar_licht
        # --- overkapping ---
        - light.outdoor_up_down_light_overkapping_3
        - light.outdoor_up_down_light_overkapping_4
        - light.outdoor_up_down_light_overkapping_5
        - light.outdoor_up_down_light_6
        - light.outdoor_up_down_light_7
        # --- voordeur ---
        - light.voordeurlampen
        - light.voordeur_lamp
        - light.voordeur_lamp_1
        - light.voordeur_lamp_3
        - light.voordeur_lamp_4
        - light.voordeur_lamp_5
        - light.floris                        # "Voordeur 3"
        # --- achtertuin (Shelly dimmer) ---
        - light.shellydimmer2_24d7ebe9595b
      # Dezelfde stopcontacten zijn ook als switch bekend; meesturen
      # kost niets en vangt af dat de light-entiteit soms niet reageert.
      buitenschakelaars:
        - switch.smart_plug_stopcontact_1
        - switch.lsc_garden_spike_eu_stopcontact_1
        - switch.lsc_garden_spike_eu_stopcontact_2

  # Staat alles al uit? Dan meteen klaar (scheelt cloudverkeer bij de
  # controlemomenten om 04:00 en voor zonsopkomst).
  - if:
      - condition: template
        value_template: >-
          {{ (expand(buitenlampen) + expand(buitenschakelaars))
             | selectattr('state', 'eq', 'on') | list | count == 0 }}
    then:
      - stop: "Alle buitenverlichting staat al uit"

  # Uitschakelen, controleren, en alleen herhalen wat nog aan staat.
  - repeat:
      sequence:
        - variables:
            nog_aan: >-
              {{ expand(buitenlampen)
                 | selectattr('state', 'eq', 'on')
                 | map(attribute='entity_id') | list }}
            schakelaars_aan: >-
              {{ expand(buitenschakelaars)
                 | selectattr('state', 'eq', 'on')
                 | map(attribute='entity_id') | list }}
        - if:
            - condition: template
              value_template: "{{ nog_aan | count > 0 }}"
          then:
            - action: light.turn_off
              target:
                entity_id: "{{ nog_aan }}"
        - if:
            - condition: template
              value_template: "{{ schakelaars_aan | count > 0 }}"
          then:
            - action: switch.turn_off
              target:
                entity_id: "{{ schakelaars_aan }}"
        # Wachten tot de statussen zijn teruggemeld; Tuya-cloud doet daar
        # soms 10+ seconden over.
        - delay:
            seconds: "{{ 15 if repeat.index <= 2 else (30 if repeat.index <= 4 else 60) }}"
      until:
        - condition: template
          value_template: >-
            {{ repeat.index >= 6
               or ((expand(buitenlampen) + expand(buitenschakelaars))
                   | selectattr('state', 'eq', 'on') | list | count == 0) }}

  # Alleen melden als het ná 6 pogingen nog niet gelukt is.
  - variables:
      restanten: >-
        {{ (expand(buitenlampen) + expand(buitenschakelaars))
           | selectattr('state', 'eq', 'on')
           | map(attribute='name') | list }}
      onbereikbaar: >-
        {{ (expand(buitenlampen) + expand(buitenschakelaars))
           | selectattr('state', 'in', ['unavailable', 'unknown'])
           | map(attribute='name') | list }}
  - if:
      - condition: template
        value_template: "{{ restanten | count > 0 }}"
    then:
      - action: notify.mobile_app_iphone_van_mark
        data:
          title: "💡 Buitenlampen niet uit gekregen"
          message: >-
            Nog aan na 6 pogingen: {{ restanten | join(', ') }}.
            {% if onbereikbaar | count > 0 %}
            Offline: {{ onbereikbaar | join(', ') }}.
            {% endif %}
          data:
            push:
              interruption-level: passive   # geen geluid 's nachts
